<!DOCTYPE html>
<html>
<head>
    <title>元宵节祝福</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: '微软雅黑', cursive;
        }

        .container {
            position: fixed;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            transition: 0.5s;
            z-index: 2;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        input, button {
            padding: 15px 25px;
            margin: 10px;
            border-radius: 30px;
            border: 2px solid #fff;
            background: transparent;
            color: #fff;
            font-size: 18px;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }

        button {
            background: #e74c3c;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #e74c3c;
        }

        .blessing {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 3em;
            text-align: center;
            text-shadow: 0 0 10px #fff;
            z-index: 1;
            animation: float 3s ease-in-out infinite;
        }

        .firework {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: explode 1.5s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(15); opacity: 0; }
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <input type="text" id="name" placeholder="输入名字领取专属祝福">
        <button onclick="showBlessing()">开启祝福</button>
    </div>
    <div id="blessingText" class="blessing"></div>

    <script>
        const blessings = {
            "陈奕赫": "火树银花元夕夜，彩灯万盏熠霞流。陈总，愿你所创事业如这十五花灯，光明璀璨，熠熠生辉。"
            "何尚烽": "千门开锁万灯明，正月中旬动地京。老何，愿你明年今日也有内人连袖起舞，与天上明月相衬。"
            "林健钿": "花灯映照团圆夜，汤圆浮沉喜乐时。祈愿这世间美好常常与君相伴，福运若银河倒泻沛然莫御。"
            "王瑞祺": "火树银花夜，灯火阑珊时。我煮月光为糖，揉春风作馅，愿君仍有良人相伴，如这汤圆般圆满。"
            "王晓慧": "灯火钱塘三五夜，明月如霜，照见人如画。小慧，愿你的美貌如这画中景、元夜灯，恒久灿烂。"
            "钟艺": "玉漏银壶且莫催，铁关金锁彻明开。愿君所从之事如今夜璀璨花灯，照鹏程之路，映青云之途。"
            "我们七个": "愿我辈兰襟之交，似星桥不锁，如璇玑长悬，若花灯不灭，同明月圆满，旧人新年，生生不断。"
        };

        function showBlessing() {
            const name = document.getElementById('name').value.trim();
            const container = document.querySelector('.container');
            const blessingText = document.getElementById('blessingText');
            
            // 显示祝福语
            blessingText.innerHTML = blessings[name] || blessings['默认'];
            container.classList.add('hidden');

            // 开始烟花动画
            createFireworks();
            setInterval(createFireworks, 500);
        }

        function createFireworks() {
            for(let i = 0; i < 15; i++) {
                const firework = document.createElement('div');
                firework.className = 'firework';
                firework.style.left = Math.random() * 100 + 'vw';
                firework.style.top = Math.random() * 100 + 'vh';
                firework.style.background = `hsl(${Math.random()*360}, 100%, 50%)`;
                firework.style.animationDelay = Math.random() * 1 + 's';
                document.body.appendChild(firework);

                // 自动移除元素
                setTimeout(() => firework.remove(), 1500);
            }
        }
    </script>
</body>
</html>
